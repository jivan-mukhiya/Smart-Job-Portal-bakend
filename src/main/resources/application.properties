spring.application.name=smart-job-portal
server.port=9000

# GLOBAL API PREFIX
server.servlet.context-path=/api/v1

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/smart_job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# JWT CONFIG
jwt.secret=Y29tcGFueS1zdXBlci1zZWNyZXQta2V5LTEyMzQ1Njc4OTAxMjM0NTY3ODkw
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# =============================================================
# FILE UPLOAD CONFIGURATION
# =============================================================

# Maximum file size
spring.servlet.multipart.max-file-size=10MB

# Maximum request size
spring.servlet.multipart.max-request-size=10MB

# Upload root directory
file.upload-dir=uploads

# Allowed image types
file.allowed-types=image/jpeg,image/jpg,image/png,image/webp

# Allowed resume types (PDF ONLY)
file.allowed-resume-types=application/pdf

# Maximum image size (5MB)
file.max-image-size=5242880

# Maximum resume size (5MB)
file.max-resume-size=5242880

# Maximum file size (10MB)
file.max-file-size=10485760

# FRONTEND
app.frontend-url=http://localhost:3000

# FILE PUBLIC BASE URL
app.file.base-url=http://localhost:9000/api/v1