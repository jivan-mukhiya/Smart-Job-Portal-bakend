spring.application.name=smart-job-portal
server.port=9000

# GLOBAL API PREFIX
server.servlet.context-path=/api/v1

# DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/smart_job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root1

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# JWT CONFIG
jwt.secret=Y29tcGFueS1zdXBlci1zZWNyZXQta2V5LTEyMzQ1Njc4OTAxMjM0NTY3ODkw
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Maximum file size
spring.servlet.multipart.max-file-size=5MB

# Maximum request size
spring.servlet.multipart.max-request-size=10MB

# Upload root directory
file.upload-dir=uploads

# Allowed image types
file.allowed-types=image/jpeg,image/jpg,image/png

# Maximum image size (bytes)
file.max-image-size=5242880

# Company images folder
file.company-dir=uploads/company

# Job Seeker images folder
file.jobseeker-dir=uploads/jobseeker